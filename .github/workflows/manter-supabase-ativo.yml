# Impede que o projeto Supabase (plano gratuito) seja pausado por inatividade.
# Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório GitHub.
name: Manter Supabase ativo
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/competicoes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
